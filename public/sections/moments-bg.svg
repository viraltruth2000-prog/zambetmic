<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7E6"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FEF3C7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 120) rotate(90) scale(560 920)">
      <stop stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="n" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.94  0 0 0 0 0.88  0 0 0 0.12 0"/>
    </filter>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#paper)"/>
  <rect width="1440" height="900" fill="url(#glow)"/>
  <rect width="1440" height="900" filter="url(#n)" opacity="0.35"/>

  <!-- Scrapbook frames -->
  <g filter="url(#shadow)" opacity="0.9" stroke="rgba(0,0,0,0.12)" stroke-width="10" stroke-linejoin="round">
    <path d="M180 560h320v230H180V560Z" fill="#FFFFFF" fill-opacity="0.75"/>
    <path d="M520 520h360v270H520V520Z" fill="#FFFFFF" fill-opacity="0.78"/>
    <path d="M900 560h360v230H900V560Z" fill="#FFFFFF" fill-opacity="0.75"/>
    <path d="M540 538h320v34H540v-34Z" fill="#FDE047" fill-opacity="0.7"/>
  </g>

  <!-- Doodles -->
  <g opacity="0.22" stroke="rgba(0,0,0,0.20)" stroke-width="10" stroke-linecap="round">
    <path d="M230 320c60-40 120-40 180 0"/>
    <path d="M1040 320c60-40 120-40 180 0"/>
    <path d="M690 320c40-26 80-26 120 0"/>
  </g>

  <!-- Confetti border -->
  <g opacity="0.20" stroke-linecap="round" stroke-width="14">
    <path d="M120 140l26 18" stroke="#FB923C"/>
    <path d="M220 120l18 28" stroke="#60A5FA"/>
    <path d="M340 150l30 0" stroke="#FDE047"/>
    <path d="M460 120l22 24" stroke="#34D399"/>
    <path d="M1180 140l26 18" stroke="#F472B6"/>
    <path d="M1280 120l18 28" stroke="#A78BFA"/>
    <path d="M1360 150l30 0" stroke="#38BDF8"/>
  </g>
</svg>
