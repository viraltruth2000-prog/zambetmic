<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="960" viewBox="0 0 1920 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1920" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.45" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
    <radialGradient id="shine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1480 300) rotate(118) scale(520 520)">
      <stop stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur40" x="-200" y="-200" width="2320" height="1360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur18" x="-200" y="-200" width="2320" height="1360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.2" fill="#0EA5E9" fill-opacity="0.32"/>
      <circle cx="16" cy="10" r="1.1" fill="#F97316" fill-opacity="0.30"/>
      <circle cx="10" cy="20" r="1.0" fill="#EC4899" fill-opacity="0.26"/>
      <circle cx="22" cy="22" r="1.0" fill="#22C55E" fill-opacity="0.24"/>
    </pattern>
  </defs>

  <!-- Base gradient -->
  <rect width="1920" height="960" fill="url(#g)"/>
  <rect width="1920" height="960" fill="url(#shine)"/>

  <!-- Big soft color blobs -->
  <g filter="url(#blur40)" opacity="0.75">
    <circle cx="160" cy="210" r="220" fill="#FB7185" fill-opacity="0.55"/>
    <circle cx="420" cy="140" r="180" fill="#38BDF8" fill-opacity="0.55"/>
    <circle cx="1760" cy="210" r="260" fill="#FDE047" fill-opacity="0.45"/>
    <circle cx="1860" cy="430" r="280" fill="#FB923C" fill-opacity="0.45"/>
    <circle cx="980" cy="920" r="360" fill="#34D399" fill-opacity="0.40"/>
  </g>

  <!-- Balloon clusters (simple, stylized) -->
  <g filter="url(#blur18)" opacity="0.65">
    <ellipse cx="140" cy="520" rx="110" ry="150" fill="#F472B6"/>
    <ellipse cx="270" cy="500" rx="95" ry="130" fill="#60A5FA"/>
    <ellipse cx="210" cy="640" rx="105" ry="145" fill="#F59E0B"/>

    <ellipse cx="1780" cy="520" rx="120" ry="160" fill="#FB923C"/>
    <ellipse cx="1640" cy="520" rx="98" ry="135" fill="#22C55E"/>
    <ellipse cx="1710" cy="650" rx="112" ry="152" fill="#38BDF8"/>
  </g>

  <!-- Subtle character silhouettes (very soft) -->
  <g opacity="0.10">
    <path d="M700 760c30-60 90-95 160-95s130 35 160 95c-38 22-92 34-160 34s-122-12-160-34Z" fill="#0F172A"/>
    <circle cx="860" cy="640" r="48" fill="#0F172A"/>
    <circle cx="1020" cy="640" r="48" fill="#0F172A"/>
  </g>

  <!-- Confetti dots -->
  <rect width="1920" height="960" fill="url(#dots)" opacity="0.75"/>

  <!-- A few confetti strokes -->
  <g opacity="0.22">
    <path d="M540 260l24 18" stroke="#0EA5E9" stroke-width="8" stroke-linecap="round"/>
    <path d="M610 330l18-24" stroke="#F97316" stroke-width="8" stroke-linecap="round"/>
    <path d="M1320 240l26-14" stroke="#22C55E" stroke-width="8" stroke-linecap="round"/>
    <path d="M1420 340l-18-26" stroke="#EC4899" stroke-width="8" stroke-linecap="round"/>
    <path d="M940 210l26 18" stroke="#FDE047" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
